# Nginx site for treviogobal.com on Hostinger VPS
# Install: sudo cp nginx-treviogobal.conf /etc/nginx/sites-available/treviogobal
#          sudo ln -sf /etc/nginx/sites-available/treviogobal /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# SSL:     sudo certbot --nginx -d treviogobal.com -d www.treviogobal.com

upstream trevio_web {
    server 127.0.0.1:3100;
    keepalive 32;
}

upstream trevio_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name treviogobal.com www.treviogobal.com;

    # Certbot challenge path (kept after SSL)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://www.treviogobal.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name treviogobal.com;

    # Certbot will replace these with real cert paths on first run;
    # until then use temporary self-signed or run certbot after HTTP is up.
    ssl_certificate     /etc/letsencrypt/live/treviogobal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/treviogobal.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.treviogobal.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.treviogobal.com;

    ssl_certificate     /etc/letsencrypt/live/treviogobal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/treviogobal.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    # Express API (paths already start with /api)
    location /api/ {
        proxy_pass http://trevio_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Next.js app
    location / {
        proxy_pass http://trevio_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
